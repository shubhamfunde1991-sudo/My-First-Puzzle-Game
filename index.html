<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Endless Runner</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    canvas {
      border: 2px solid black;
      background: white;
      max-width: 100%;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h2>Endless Runner</h2>
  <p>Score: <span id="score">0</span></p>

  <canvas id="game" width="320" height="220"></canvas>
  <br>
  <button onclick="jump()">Jump</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let player = {
      x: 40,
      y: 170,
      w: 20,
      h: 20,
      vy: 0,
      jumping: false
    };

    let obstacle = {
      x: 320,
      y: 170,
      w: 20,
      h: 20
    };

    let score = 0;
    let speed = 3;

    function jump() {
      if (!player.jumping) {
        player.vy = -9;
        player.jumping = true;
      }
    }

    function update() {
      player.y += player.vy;
      player.vy += 0.5;

      if (player.y >= 170) {
        player.y = 170;
        player.vy = 0;
        player.jumping = false;
      }

      obstacle.x -= speed;

      if (obstacle.x < -20) {
        obstacle.x = 320;
        score++;
        document.getElementById("score").innerText = score;

        if (score % 5 === 0) {
          speed += 0.5;
        }
      }

      if (
        player.x < obstacle.x + obstacle.w &&
        player.x + player.w > obstacle.x &&
        player.y < obstacle.y + obstacle.h &&
        player.y + player.h > obstacle.y
      ) {
        alert("Game Over. Score: " + score);
        score = 0;
        speed = 3;
        obstacle.x = 320;
        player.y = 170;
        document.getElementById("score").innerText = score;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("click", jump);

    loop();
  </script>

</body>
</html>
