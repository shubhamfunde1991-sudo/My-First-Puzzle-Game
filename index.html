<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Color Runner</title>
  <style>
    body {
      margin: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #7dd3fc, #fef08a);
    }

    h2 {
      margin-top: 10px;
      margin-bottom: 6px;
    }

    #scoreBox {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    canvas {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      touch-action: manipulation;
    }

    button {
      margin-top: 12px;
      padding: 14px 26px;
      font-size: 22px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
    }
  </style>
</head>
<body>

<h2>Color Runner</h2>
<div id="scoreBox">Score: <span id="score">0</span></div>

<canvas id="game" width="420" height="260"></canvas>
<br>
<button id="jumpBtn">Jump</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const groundY = 180;

let player = {
  x: 60,
  y: groundY,
  w: 34,
  h: 42,
  vy: 0,
  jumping: false
};

let obstacle = {
  x: 430,
  y: groundY + 12,
  w: 28,
  h: 30
};

let coin = {
  x: 650,
  y: 120,
  r: 10
};

let score = 0;
let speed = 4;

function jump() {
  if (!player.jumping) {
    player.vy = -13;
    player.jumping = true;
  }
}

function resetGame() {
  score = 0;
  speed = 4;
  obstacle.x = 430;
  coin.x = 650;
  player.y = groundY;
  player.vy = 0;
  player.jumping = false;
  document.getElementById("score").innerText = score;
}

function update() {
  player.y += player.vy;
  player.vy += 0.7;

  if (player.y >= groundY) {
    player.y = groundY;
    player.vy = 0;
    player.jumping = false;
  }

  obstacle.x -= speed;
  coin.x -= speed;

  if (obstacle.x < -obstacle.w) {
    obstacle.x = 430 + Math.random() * 120;
    score++;
    document.getElementById("score").innerText = score;

    if (score % 5 === 0) {
      speed += 0.4;
    }
  }

  if (coin.x < -20) {
    coin.x = 500 + Math.random() * 200;
    coin.y = 90 + Math.random() * 50;
  }

  if (
    player.x < obstacle.x + obstacle.w &&
    player.x + player.w > obstacle.x &&
    player.y < obstacle.y + obstacle.h &&
    player.y + player.h > obstacle.y
  ) {
    alert("Game Over. Score: " + score);
    resetGame();
  }

  if (
    player.x < coin.x + coin.r &&
    player.x + player.w > coin.x - coin.r &&
    player.y < coin.y + coin.r &&
    player.y + player.h > coin.y - coin.r
  ) {
    score += 2;
    document.getElementById("score").innerText = score;
    coin.x = 500 + Math.random() * 200;
  }
}

function drawPlayer() {
  ctx.fillStyle = "#2563eb";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "#fde68a";
  ctx.beginPath();
  ctx.arc(player.x + 17, player.y - 8, 10, 0, Math.PI * 2);
  ctx.fill();
}

function drawObstacle() {
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
}

function drawCoin() {
  ctx.fillStyle = "#facc15";
  ctx.beginPath();
  ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(0, groundY + 42, canvas.width, 18);
}

function drawSky() {
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(90, 55, 16, 0, Math.PI * 2);
  ctx.arc(110, 50, 18, 0, Math.PI * 2);
  ctx.arc(130, 55, 16, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawSky();
  drawGround();
  drawCoin();
  drawObstacle();
  drawPlayer();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("jumpBtn").addEventListener("touchstart", function(e) {
  e.preventDefault();
  jump();
});

document.getElementById("jumpBtn").addEventListener("click", jump);

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  jump();
});

canvas.addEventListener("click", jump);

loop();
</script>

</body>
</html>
