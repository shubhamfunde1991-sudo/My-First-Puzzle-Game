<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Subway Runner</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(#7dd3fc, #fef08a);
  font-family: Arial, sans-serif;
}

#ui {
  position: fixed;
  top: 10px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}
</style>
</head>
<body>

<div id="ui">Score: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const laneX = [canvas.width * 0.25, canvas.width * 0.5, canvas.width * 0.75];

let lane = 1;
let score = 0;
let speed = 7;

let player = {
  x: laneX[lane],
  y: canvas.height - 140,
  w: 36,
  h: 58,
  vy: 0,
  jumping: false
};

let obstacle = {
  lane: 1,
  y: -100,
  w: 40,
  h: 55
};

function updateLane() {
  player.x = laneX[lane] - player.w / 2;
}

updateLane();

function jump() {
  if (!player.jumping) {
    player.vy = -18;
    player.jumping = true;
  }
}

function newObstacle() {
  obstacle.lane = Math.floor(Math.random() * 3);
  obstacle.y = -100;
}

function resetGame() {
  score = 0;
  speed = 7;
  document.getElementById("score").innerText = score;
  lane = 1;
  updateLane();
  newObstacle();
}

function update() {
  player.y += player.vy;
  player.vy += 0.9;

  if (player.y >= canvas.height - 140) {
    player.y = canvas.height - 140;
    player.vy = 0;
    player.jumping = false;
  }

  obstacle.y += speed;

  if (obstacle.y > canvas.height + 60) {
    score++;
    document.getElementById("score").innerText = score;
    newObstacle();

    if (score % 5 === 0) {
      speed += 0.5;
    }
  }

  const ox = laneX[obstacle.lane] - obstacle.w / 2;

  if (
    player.x < ox + obstacle.w &&
    player.x + player.w > ox &&
    player.y < obstacle.y + obstacle.h &&
    player.y + player.h > obstacle.y
  ) {
    alert("Game Over. Score: " + score);
    resetGame();
  }
}

function drawRoad() {
  ctx.fillStyle = "#444";
  ctx.fillRect(canvas.width * 0.15, 0, canvas.width * 0.7, canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.38, 0);
  ctx.lineTo(canvas.width * 0.38, canvas.height);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.62, 0);
  ctx.lineTo(canvas.width * 0.62, canvas.height);
  ctx.stroke();
}

function drawPlayer() {
  ctx.fillStyle = "#2563eb";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "#fde68a";
  ctx.beginPath();
  ctx.arc(player.x + 18, player.y - 10, 11, 0, Math.PI * 2);
  ctx.fill();
}

function drawObstacle() {
  const ox = laneX[obstacle.lane] - obstacle.w / 2;
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(ox, obstacle.y, obstacle.w, obstacle.h);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawRoad();
  drawObstacle();
  drawPlayer();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});

canvas.addEventListener("touchend", function(e) {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 25 && lane < 2) {
      lane++;
      updateLane();
    }
    if (dx < -25 && lane > 0) {
      lane--;
      updateLane();
    }
  } else {
    if (dy < -25) {
      jump();
    }
  }
});

newObstacle();
loop();
</script>

</body>
</html>
