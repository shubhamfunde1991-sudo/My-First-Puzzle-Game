<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bike Subway Runner</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(#7dd3fc, #fde68a);
}

#ui {
  position: fixed;
  top: 10px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  z-index: 10;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}
</style>
</head>
<body>

<div id="ui">Score: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  laneX = [
    canvas.width * 0.30,
    canvas.width * 0.50,
    canvas.width * 0.70
  ];
}
window.addEventListener("resize", resize);

let laneX = [];
resize();

let lane = 1;
let score = 0;
let speed = 8;

let player = {
  x: 0,
  y: 0,
  w: 48,
  h: 60,
  vy: 0,
  jumping: false
};

let obstacle = {
  lane: 1,
  y: -120,
  w: 48,
  h: 70
};

function updateLane() {
  player.x = laneX[lane] - player.w / 2;
  player.y = canvas.height - 150;
}
updateLane();

function jump() {
  if (!player.jumping) {
    player.vy = -18;
    player.jumping = true;
  }
}

function newObstacle() {
  obstacle.lane = Math.floor(Math.random() * 3);
  obstacle.y = -140;
}

function resetGame() {
  score = 0;
  speed = 8;
  lane = 1;
  document.getElementById("score").innerText = score;
  updateLane();
  newObstacle();
}

function update() {
  player.y += player.vy;
  player.vy += 0.9;

  const ground = canvas.height - 150;

  if (player.y >= ground) {
    player.y = ground;
    player.vy = 0;
    player.jumping = false;
  }

  obstacle.y += speed;

  if (obstacle.y > canvas.height + 80) {
    score++;
    document.getElementById("score").innerText = score;
    newObstacle();

    if (score % 5 === 0) {
      speed += 0.6;
    }
  }

  const ox = laneX[obstacle.lane] - obstacle.w / 2;

  if (
    player.x < ox + obstacle.w &&
    player.x + player.w > ox &&
    player.y < obstacle.y + obstacle.h &&
    player.y + player.h > obstacle.y
  ) {
    alert("Game Over. Score: " + score);
    resetGame();
  }
}

function drawRoad() {
  ctx.fillStyle = "#374151";
  ctx.fillRect(canvas.width * 0.18, 0, canvas.width * 0.64, canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 5;

  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.40, 0);
  ctx.lineTo(canvas.width * 0.40, canvas.height);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.60, 0);
  ctx.lineTo(canvas.width * 0.60, canvas.height);
  ctx.stroke();
}

function drawPlayer() {
  const x = player.x;
  const y = player.y;

  ctx.fillStyle = "#2563eb";
  ctx.fillRect(x + 8, y + 20, 32, 16);

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(x + 12, y + 44, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + 36, y + 44, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fde68a";
  ctx.beginPath();
  ctx.arc(x + 24, y + 8, 8, 0, Math.PI * 2);
  ctx.fill();
}

function drawObstacle() {
  const ox = laneX[obstacle.lane] - obstacle.w / 2;

  ctx.fillStyle = "#ef4444";
  ctx.fillRect(ox, obstacle.y, obstacle.w, obstacle.h);

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(ox + 10, obstacle.y + obstacle.h, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(ox + 38, obstacle.y + obstacle.h, 8, 0, Math.PI * 2);
  ctx.fill();
}

function drawSky() {
  ctx.fillStyle = "white";

  ctx.beginPath();
  ctx.arc(80, 60, 18, 0, Math.PI * 2);
  ctx.arc(100, 52, 20, 0, Math.PI * 2);
  ctx.arc(122, 60, 18, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawSky();
  drawRoad();
  drawObstacle();
  drawPlayer();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

let startX = 0;
let startY = 0;

canvas.addEventListener("touchstart", function(e) {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

canvas.addEventListener("touchend", function(e) {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 25 && lane < 2) {
      lane++;
      updateLane();
    }

    if (dx < -25 && lane > 0) {
      lane--;
      updateLane();
    }
  } else {
    if (dy < -25) {
      jump();
    }
  }
});

newObstacle();
loop();
</script>

</body>
</html>
