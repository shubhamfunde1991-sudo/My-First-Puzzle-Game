<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Endless Runner</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f5f5f5;
    }

    canvas {
      border: 2px solid black;
      background: white;
      width: 100%;
      max-width: 420px;
      touch-action: manipulation;
    }

    button {
      margin-top: 12px;
      padding: 14px 26px;
      font-size: 22px;
    }
  </style>
</head>
<body>

  <h2>Endless Runner</h2>
  <p>Score: <span id="score">0</span></p>

  <canvas id="game" width="420" height="260"></canvas>
  <br>
  <button id="jumpBtn">Jump</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const groundY = 200;

    let player = {
      x: 50,
      y: groundY,
      w: 34,
      h: 34,
      vy: 0,
      jumping: false
    };

    let obstacle = {
      x: 420,
      y: groundY,
      w: 30,
      h: 34
    };

    let score = 0;
    let speed = 4;

    function jump() {
      if (!player.jumping) {
        player.vy = -12;
        player.jumping = true;
      }
    }

    function resetGame() {
      score = 0;
      speed = 4;
      obstacle.x = 420;
      player.y = groundY;
      player.vy = 0;
      player.jumping = false;
      document.getElementById("score").innerText = score;
    }

    function update() {
      player.y += player.vy;
      player.vy += 0.6;

      if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.jumping = false;
      }

      obstacle.x -= speed;

      if (obstacle.x < -obstacle.w) {
        obstacle.x = 420;
        score++;
        document.getElementById("score").innerText = score;

        if (score % 5 === 0) {
          speed += 0.5;
        }
      }

      if (
        player.x < obstacle.x + obstacle.w &&
        player.x + player.w > obstacle.x &&
        player.y < obstacle.y + obstacle.h &&
        player.y + player.h > obstacle.y
      ) {
        alert("Game Over. Score: " + score);
        resetGame();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillRect(0, groundY + player.h, canvas.width, 3);

      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById("jumpBtn").addEventListener("touchstart", function(e) {
      e.preventDefault();
      jump();
    });

    document.getElementById("jumpBtn").addEventListener("click", jump);

    canvas.addEventListener("touchstart", function(e) {
      e.preventDefault();
      jump();
    });

    canvas.addEventListener("click", jump);

    loop();
  </script>

</body>
</html>
