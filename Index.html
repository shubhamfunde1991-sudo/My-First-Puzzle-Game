<html>
<head>
  <meta charset="UTF-8">
  <title>Color Match</title>
</head>
<body>
  <h1>Color Match</h1>
  <button onclick="score = score + 1; document.getElementById('score').innerText = score;">
    Tap Me
  </button>
  <p>Score: <span id="score">0</span></p>

  <script>
    let score = 0;
  </script>
</body>
</html>
